name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE

jobs:
  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make install-tools
      - run: make lint-go

  lint-web:
    name: Lint (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make lint-web

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make build
        env:
          APP_VERSION: ${{ github.sha }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_DATETIME: ${{ github.event.repository.updated_at }}

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test
